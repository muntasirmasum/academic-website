<!DOCTYPE html>
<!-- Link-preview card (1200×630) for LinkedIn, Bluesky, etc.
     Rendered to ../og-card.png by scripts/make-images.js. Edit the text here, then re-run. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; }
  .card { width:1200px; height:630px; box-sizing:border-box; background:#f5f6f8;
          border-left:14px solid #46166b; display:flex; align-items:center; gap:52px; padding:0 70px 0 80px; }
  .photo { width:260px; height:260px; border-radius:50%; flex:none; box-shadow:0 6px 22px rgba(31,45,58,.12); }
  .name { font:600 68px/1.04 'Newsreader', Georgia, serif; letter-spacing:-0.7px; white-space:nowrap; color:#1f2d3a; }
  .role { font:500 28px/1.3 'IBM Plex Sans', sans-serif; color:#46166b; white-space:nowrap; margin-top:18px; }
  .affil { font:400 25px/1.4 'IBM Plex Sans', sans-serif; color:#5a6571; margin-top:6px; }
  .rule { height:1px; background:#e7eaee; margin:30px 0 22px; }
  .topics { font:400 22px/1.45 'IBM Plex Sans', sans-serif; color:#3b4651; }
  .url { font:600 19px 'IBM Plex Sans', sans-serif; letter-spacing:.12em; text-transform:uppercase; color:#74808b; margin-top:16px; }
</style>
</head>
<body>
<div class="card">
  <img class="photo" src="../headshot-circle.png" alt="">
  <div>
    <div class="name">Muntasir Masum, PhD</div>
    <div class="role">Assistant Professor of Epidemiology &amp; Biostatistics</div>
    <div class="affil">University at Albany, State University of New York</div>
    <div class="rule"></div>
    <div class="topics">Alcohol epidemiology · Social determinants of health<br>Machine learning for population health</div>
    <div class="url">muntasirmasum.com</div>
  </div>
</div>
</body>
</html>
